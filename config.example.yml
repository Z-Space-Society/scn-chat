# SCN Chat example settings. Copy to config.yml and edit.

app:
  name: SCN Chat Server
  publicUrl: http://127.0.0.1:3000
  port: 3000
  dataDir: ./data
  logLevel: info

auth:
  scopeMode: raw
  sessionTtlDays: 30
  plcUrl: https://plc.directory

turns:
  ratePerMinute: 10
  maxSteps: 8
  timeoutSeconds: 600
  backfillMinutes: 60
  # Starts every turn's instructions. Placeholders: {{appName}}, {{date}}, {{time}}, {{timezone}}.
  systemPrompt: >-
    You are an AI assistant in {{appName}}. Today is {{date}} ({{timezone}}).
    Replies are rendered as Markdown. Raw HTML is not rendered, and images load only when the user clicks them.

sync:
  safetyNet: { enabled: true, intervalMinutes: 15, activeWithinHours: 24 }
  discovery: { intervalMinutes: 60, activeWithinDays: 30 }
  allowUserOptOut: true

# Role definitions, each a list of DIDs. Every signed-in user also has the role "user".
roles: {}

# Plugins load in this order. A package can be listed more than once with different options.
plugins:
  - package: '@scn-chat/plugin-openai-compatible'
    options:
      id: scn
      name: SCN
      baseURL: https://api.sharedcomputer.network/v1
      apiKey: ${SCN_API_KEY}
  - package: '@scn-chat/plugin-openai-compatible'
    options:
      id: cocore
      name: co/core
      baseURL: https://cocore.dev/v1
      apiKey: ${COCORE_API_KEY}
  - package: '@scn-chat/plugin-anthropic'
    options:
      apiKey: ${ANTHROPIC_API_KEY}
  - package: '@scn-chat/plugin-openai'
    options:
      apiKey: ${OPENAI_API_KEY}
  - package: '@scn-chat/plugin-google'
    options:
      apiKey: ${GOOGLE_API_KEY}
  - package: '@scn-chat/plugin-openai-compatible'
    options:
      id: custom
      name: Your own endpoint
      userEndpoints: true


  - package: '@scn-chat/plugin-pdf-text'
  - package: '@scn-chat/plugin-titles'
  # Engines: duckduckgo (no key, best effort), brave, tavily, searxng (needs baseURL), kagi.
  - package: '@scn-chat/plugin-web-search'
    options:
      engine: duckduckgo
      enabledByDefault: false
      userToggle: true
      userEngines: true
      maxResults: 5
  - package: '@scn-chat/plugin-web-fetch'
    options:
      allowDomains: []
      denyDomains: []
      userToggle: true
      maxCharacters: 20000
      maxBytes: 5000000
      maxFileBytes: 20000000
      timeoutSeconds: 20

# Models available to users in the listed roles.
